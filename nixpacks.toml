# PyAV's official Linux wheel bundles FFmpeg/codecs but dynamically links the
# standard C++ runtime. Extend (rather than replace) Nixpacks' Python plan and
# expose that runtime through Nixpacks' supported nixLibs mechanism.
[phases.setup]
nixLibs = ["...", "gcc-unwrapped"]

# Fail the build instead of silently compiling PyAV against an incomplete or
# incompatible system FFmpeg installation.
[variables]
PIP_ONLY_BINARY = "av"

# Record provenance inside the built artifact; never infer deployment from a push.
[phases.build]
cmds = ["...", "python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements.voice-diagnostics.txt", "python -c \"import voice_diagnostic_tools as t; assert t.runtime().get('verified'), 'Pinned FFmpeg verification failed'\"", "python build_info.py --write"]
