{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="/static/loyalty.css?v=2"><main class="loyalty" data-csrf="{{ csrf }}"><a href="/crm/loyalty/migration">← Historical Customer Migration</a><h1>Historical migration results</h1><p>Approval and execution are separate actions. Reviewing this page does not approve anything.</p><div id="loyalty-feedback" role="status"></div><section id="loyalty-job-detail" data-job-id="{{ job.id }}" class="loyalty-card"></section>
{% if can_execute %}<form id="loyalty-approve-form" class="loyalty-form"><h2>Approve reviewed preview</h2><label>Migration ID<input name="id" readonly required class="loyalty-token"></label><label>Preview digest<input name="digest" readonly required class="loyalty-token"></label><label>Management reason<textarea name="reason" required></textarea></label><button>Approve migration (15-minute start window)</button></form><form id="loyalty-execute-form" class="loyalty-form"><h2>Execute approved batch</h2><label>Migration ID<input name="id" readonly required class="loyalty-token"></label><label>Approved digest<input name="digest" readonly required class="loyalty-token"></label><button>Process next batch (maximum 100)</button></form>{% endif %}</main><script src="/static/loyalty.js?v=2" defer></script>{% endblock %}
